name: Generate SBOM

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name or tag to generate the SBOM for"
        required: true
        type: string

run-name: Generate SBOM for ${{ inputs.release_name }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  generate:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - id: release
        name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          RELEASES_JSON="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" > "${RELEASES_JSON}"

          TAG_NAME="$(jq -sr --arg release "${RELEASE_NAME}" '[.[][] | select(.name == $release or .tag_name == $release)][0].tag_name // empty' "${RELEASES_JSON}")"

          if [ -z "${TAG_NAME}" ]; then
            echo "::error title=Release not found::No release found with the provided name or tag."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen@12 --omit=optional --ignore-scripts

      - id: sbom
        name: Generate CycloneDX SBOM
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          SAFE_RELEASE_TAG="$(printf '%s' "${RELEASE_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          if [ -z "${SAFE_RELEASE_TAG}" ]; then
            SAFE_RELEASE_TAG="release"
          fi

          OUTPUT_FILE="sbom/services-${SAFE_RELEASE_TAG}.cyclonedx.json"
          ARTIFACT_NAME="services-${SAFE_RELEASE_TAG}-cyclonedx-sbom"

          mkdir -p sbom
          cdxgen . \
            --type js \
            --recurse \
            --no-install-deps \
            --spec-version 1.6 \
            --project-name services \
            --project-version "${RELEASE_TAG}" \
            --output "${OUTPUT_FILE}"

          echo "output_file=${OUTPUT_FILE}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Remove npm dev dependencies from SBOM
        env:
          SBOM_FILE: ${{ steps.sbom.outputs.output_file }}
        run: |
          node <<'NODE'
          "use strict";

          const fs = require("node:fs");
          const path = require("node:path");

          const sbomFile = process.env.SBOM_FILE;
          if (!sbomFile) {
            throw new Error("SBOM_FILE is not set.");
          }

          function findPackageLocks(directory) {
            const packageLocks = [];

            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === ".git" || entry.name === "node_modules" || entry.name === "sbom") {
                continue;
              }

              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                packageLocks.push(...findPackageLocks(entryPath));
              } else if (entry.isFile() && entry.name === "package-lock.json") {
                packageLocks.push(entryPath);
              }
            }

            return packageLocks;
          }

          function packageNameFromLockPath(lockPath) {
            const marker = "node_modules/";
            const normalizedPath = lockPath.replaceAll("\\", "/");
            const markerIndex = normalizedPath.lastIndexOf(marker);

            return markerIndex === -1 ? null : normalizedPath.slice(markerIndex + marker.length);
          }

          function collectLegacyDependencies(dependencies, devIdentities, runtimeIdentities) {
            if (!dependencies || typeof dependencies !== "object") {
              return;
            }

            for (const [name, entry] of Object.entries(dependencies)) {
              if (!entry || !entry.version) {
                continue;
              }

              const identity = `${name}@${entry.version}`;
              if (entry.dev === true) {
                devIdentities.add(identity);
              } else {
                runtimeIdentities.add(identity);
              }

              collectLegacyDependencies(entry.dependencies, devIdentities, runtimeIdentities);
            }
          }

          function collectPackageLockIdentities(lockfile, devIdentities, runtimeIdentities) {
            const lock = JSON.parse(fs.readFileSync(lockfile, "utf8"));

            if (lock.packages && typeof lock.packages === "object") {
              for (const [packagePath, entry] of Object.entries(lock.packages)) {
                if (!packagePath || !entry || !entry.version) {
                  continue;
                }

                const name = entry.name || packageNameFromLockPath(packagePath);
                if (!name) {
                  continue;
                }

                const identity = `${name}@${entry.version}`;
                if (entry.dev === true) {
                  devIdentities.add(identity);
                } else {
                  runtimeIdentities.add(identity);
                }
              }
            }

            collectLegacyDependencies(lock.dependencies, devIdentities, runtimeIdentities);
          }

          function npmIdentityFromPurl(purl) {
            if (!purl || !purl.startsWith("pkg:npm/")) {
              return null;
            }

            const packagePart = decodeURIComponent(purl.slice("pkg:npm/".length).split(/[?#]/)[0]);
            const versionSeparatorIndex = packagePart.lastIndexOf("@");
            if (versionSeparatorIndex <= 0) {
              return null;
            }

            return packagePart.slice(0, versionSeparatorIndex) + "@" + packagePart.slice(versionSeparatorIndex + 1);
          }

          const devIdentities = new Set();
          const runtimeIdentities = new Set();
          const packageLocks = findPackageLocks(process.cwd());

          if (packageLocks.length === 0) {
            throw new Error("No package-lock.json files found; cannot filter npm dev dependencies.");
          }

          for (const packageLock of packageLocks) {
            collectPackageLockIdentities(packageLock, devIdentities, runtimeIdentities);
          }

          for (const identity of runtimeIdentities) {
            devIdentities.delete(identity);
          }

          const sbom = JSON.parse(fs.readFileSync(sbomFile, "utf8"));
          const components = Array.isArray(sbom.components) ? sbom.components : [];
          const removedComponents = [];
          const keptComponents = [];

          for (const component of components) {
            const identity = npmIdentityFromPurl(component.purl);
            if (identity && devIdentities.has(identity)) {
              removedComponents.push(component);
            } else {
              keptComponents.push(component);
            }
          }

          sbom.components = keptComponents;

          const keptRefs = new Set(keptComponents.map((component) => component["bom-ref"]).filter(Boolean));
          if (sbom.metadata?.component?.["bom-ref"]) {
            keptRefs.add(sbom.metadata.component["bom-ref"]);
          }

          if (Array.isArray(sbom.dependencies)) {
            sbom.dependencies = sbom.dependencies
              .map((dependency) => ({
                ...dependency,
                dependsOn: Array.isArray(dependency.dependsOn)
                  ? dependency.dependsOn.filter((reference) => keptRefs.has(reference))
                  : dependency.dependsOn,
                provides: Array.isArray(dependency.provides)
                  ? dependency.provides.filter((reference) => keptRefs.has(reference))
                  : dependency.provides,
              }))
              .filter((dependency) => keptRefs.has(dependency.ref));
          }

          fs.writeFileSync(sbomFile, JSON.stringify(sbom, null, 2) + "\n");

          console.log(`Removed ${removedComponents.length} npm dev dependency component(s) from ${sbomFile}.`);
          for (const component of removedComponents.slice(0, 50)) {
            console.log(`- ${npmIdentityFromPurl(component.purl) || component.name}`);
          }
          if (removedComponents.length > 50) {
            console.log(`... and ${removedComponents.length - 50} more`);
          }
          NODE

      - name: Validate SBOM format
        run: |
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6"' "${{ steps.sbom.outputs.output_file }}" > /dev/null

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sbom.outputs.artifact_name }}
          path: ${{ steps.sbom.outputs.output_file }}
          if-no-files-found: error
